<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>التقارير - Shassiha HR</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Cairo,sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

.header{
    background:#ff7a00;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.header h1{
    font-size:22px;
}

.header a{
    color:white;
    text-decoration:none;
    font-size:14px;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.section-title{
    font-size:16px;
    font-weight:bold;
    margin:25px 0 12px;
    color:#444;
}

.section-title:first-child{
    margin-top:0;
}

/* ============ STAT CARDS ============ */

.stats-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));
    gap:16px;
}

.stat-card{
    background:white;
    border-radius:16px;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
    border-top:5px solid #ff7a00;
}

.stat-card.active{
    border-top-color:#16833b;
}

.stat-card.ended{
    border-top-color:#c62828;
}

.stat-card.direct{
    border-top-color:#16833b;
}

.stat-card.leave{
    border-top-color:#2878d0;
}

.stat-card.warningc{
    border-top-color:#a56a00;
}

.stat-card.endc{
    border-top-color:#c62828;
}

.stat-icon{
    font-size:30px;
    margin-bottom:8px;
}

.stat-number{
    font-size:30px;
    font-weight:bold;
    color:#222;
}

.stat-label{
    font-size:13px;
    color:#777;
    margin-top:5px;
}

/* ============ PANELS ============ */

.panel{
    background:white;
    border-radius:16px;
    padding:22px;
    margin-top:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.panel h3{
    margin-bottom:15px;
    font-size:16px;
}

.bar-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.bar-label{
    width:130px;
    font-size:13px;
    color:#444;
    flex-shrink:0;
}

.bar-track{
    flex:1;
    background:#f0f2f5;
    border-radius:8px;
    height:22px;
    overflow:hidden;
    position:relative;
}

.bar-fill{
    background:#ff7a00;
    height:100%;
    border-radius:8px;
    transition:width .4s;
}

.bar-count{
    width:35px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
    color:#444;
    flex-shrink:0;
}

.empty{
    text-align:center;
    color:#888;
    padding:25px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:center;
    font-size:13px;
}

th{
    background:#fafafa;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:11px;
}

.badge-direct{
    background:#e7f7ed;
    color:#16833b;
}

.badge-leave{
    background:#e8f1ff;
    color:#2878d0;
}

.badge-warning{
    background:#fff4dc;
    color:#a56a00;
}

.badge-end{
    background:#ffe5e5;
    color:#c62828;
}

.filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.filters select,
.filters input{
    padding:10px 14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-family:Cairo;
    font-size:13px;
    background:white;
}

@media(max-width:700px){

    .header{
        flex-direction:column;
        gap:8px;
        text-align:center;
    }

    table{
        min-width:700px;
    }

    .panel{
        overflow-x:auto;
    }

}

</style>

</head>

<body>


<div class="header">

    <h1>
        📊 التقارير
    </h1>

    <a href="index.html">
        ← الرئيسية
    </a>

</div>


<div class="container">


    <!-- ============ الموظفين ============ -->

    <div class="section-title">
        👥 الموظفين
    </div>

    <div class="stats-grid" id="employeeStats">

        <div class="stat-card">
            <div class="stat-icon">⏳</div>
            <div class="stat-number">...</div>
            <div class="stat-label">جاري التحميل</div>
        </div>

    </div>


    <div class="panel">

        <h3>
            توزيع الموظفين حسب القسم
        </h3>

        <div id="departmentChart">
            <div class="empty">
                ⏳ جاري التحميل...
            </div>
        </div>

    </div>


    <!-- ============ المعاملات ============ -->

    <div class="section-title">
        📄 المعاملات
    </div>

    <div class="stats-grid" id="transactionStats">

        <div class="stat-card">
            <div class="stat-icon">⏳</div>
            <div class="stat-number">...</div>
            <div class="stat-label">جاري التحميل</div>
        </div>

    </div>


    <div class="panel">

        <h3>
            سجل المعاملات
        </h3>

        <div class="filters">

            <select id="filterType">

                <option value="">
                    كل الأنواع
                </option>

                <option value="مباشرة">
                    مباشرة
                </option>

                <option value="إجازة">
                    إجازة
                </option>

                <option value="إنذار">
                    إنذار
                </option>

                <option value="إنهاء خدمة">
                    إنهاء خدمة
                </option>

            </select>

            <input
                type="date"
                id="filterFrom"
                title="من تاريخ">

            <input
                type="date"
                id="filterTo"
                title="إلى تاريخ">

        </div>

        <div id="transactionsTable">
            <div class="empty">
                ⏳ جاري التحميل...
            </div>
        </div>

    </div>


</div>


<script>


/* =========================================
   API
========================================= */

const API =
"https://script.google.com/macros/s/AKfycbw6pnqbRn3VyJvFjk0RGfEt8VXdBkOq2uqooSvxi0onjcUStpJ_hOGNZVPLimRA-ZNAGQ/exec";


let allEmployees = [];

let allTransactions = [];


/* =========================================
   جلب أول قيمة موجودة من عدة أسماء أعمدة محتملة
========================================= */

function getField(obj, keys){

    for(const key of keys){

        if(
            obj[key] !== undefined &&
            obj[key] !== ""
        ){

            return obj[key];

        }

    }

    return "";

}


/* =========================================
   تحميل البيانات
========================================= */

async function loadData(){

    try{

        const [
            employeesRes,
            transactionsRes
        ] = await Promise.all([

            fetch(API,{

                method:"POST",

                body:JSON.stringify({
                    action:"getEmployees"
                })

            }),

            fetch(API,{

                method:"POST",

                body:JSON.stringify({
                    action:"getTransactions"
                })

            })

        ]);


        const employeesData =
            await employeesRes.json();


        const transactionsData =
            await transactionsRes.json();


        allEmployees =
            employeesData.status === "success"
            ?
            (employeesData.employees || [])
            :
            [];


        allTransactions =
            transactionsData.status === "success"
            ?
            (transactionsData.transactions || [])
            :
            [];


        renderEmployeeStats();

        renderDepartmentChart();

        renderTransactionStats();

        renderTransactionsTable();


    }
    catch(error){

        console.error(error);

        document.getElementById(
            "employeeStats"
        ).innerHTML = `
            <div class="empty">
                ❌ فشل تحميل البيانات
            </div>
        `;

    }

}


/* =========================================
   إحصائيات الموظفين
========================================= */

function renderEmployeeStats(){

    const total =
        allEmployees.length;


    const active =
        allEmployees.filter(
            e => String(
                e["الحالة"] || ""
            ).trim() !== "منتهي الخدمة"
        ).length;


    const ended =
        total - active;


    document.getElementById(
        "employeeStats"
    ).innerHTML = `

        <div class="stat-card">
            <div class="stat-icon">👥</div>
            <div class="stat-number">${total}</div>
            <div class="stat-label">إجمالي الموظفين</div>
        </div>

        <div class="stat-card active">
            <div class="stat-icon">✅</div>
            <div class="stat-number">${active}</div>
            <div class="stat-label">مستمرون</div>
        </div>

        <div class="stat-card ended">
            <div class="stat-icon">🔴</div>
            <div class="stat-number">${ended}</div>
            <div class="stat-label">منتهو الخدمة</div>
        </div>

    `;

}


/* =========================================
   توزيع الموظفين حسب القسم
========================================= */

function renderDepartmentChart(){

    const box =
        document.getElementById(
            "departmentChart"
        );


    const active =
        allEmployees.filter(
            e => String(
                e["الحالة"] || ""
            ).trim() !== "منتهي الخدمة"
        );


    if(!active.length){

        box.innerHTML = `
            <div class="empty">
                لا يوجد موظفون مستمرون حالياً
            </div>
        `;

        return;

    }


    const counts = {};


    active.forEach(e => {

        const dept =
            e["القسم"] || "غير محدد";


        counts[dept] =
            (counts[dept] || 0) + 1;

    });


    const max =
        Math.max(
            ...Object.values(counts)
        );


    let html = "";


    Object.keys(counts)
    .sort(
        (a,b) => counts[b] - counts[a]
    )
    .forEach(dept => {

        const count =
            counts[dept];


        const percent =
            Math.round(
                (count / max) * 100
            );


        html += `

            <div class="bar-row">

                <div class="bar-label">
                    ${safe(dept)}
                </div>

                <div class="bar-track">
                    <div
                        class="bar-fill"
                        style="width:${percent}%">
                    </div>
                </div>

                <div class="bar-count">
                    ${count}
                </div>

            </div>

        `;

    });


    box.innerHTML =
        html;

}


/* =========================================
   إحصائيات المعاملات
========================================= */

function renderTransactionStats(){

    const counts = {

        "مباشرة": 0,

        "إجازة": 0,

        "إنذار": 0,

        "إنهاء خدمة": 0

    };


    allTransactions.forEach(t => {

        const type =
            getField(
                t,
                ["نوع المعاملة","النوع"]
            );


        if(counts[type] !== undefined){

            counts[type]++;

        }

    });


    document.getElementById(
        "transactionStats"
    ).innerHTML = `

        <div class="stat-card direct">
            <div class="stat-icon">📄</div>
            <div class="stat-number">${counts["مباشرة"]}</div>
            <div class="stat-label">كتب مباشرة</div>
        </div>

        <div class="stat-card leave">
            <div class="stat-icon">🏖️</div>
            <div class="stat-number">${counts["إجازة"]}</div>
            <div class="stat-label">إجازات</div>
        </div>

        <div class="stat-card warningc">
            <div class="stat-icon">⚠️</div>
            <div class="stat-number">${counts["إنذار"]}</div>
            <div class="stat-label">إنذارات</div>
        </div>

        <div class="stat-card endc">
            <div class="stat-icon">🔴</div>
            <div class="stat-number">${counts["إنهاء خدمة"]}</div>
            <div class="stat-label">إنهاء خدمة</div>
        </div>

    `;

}


/* =========================================
   جدول المعاملات (مع فلترة)
========================================= */

function renderTransactionsTable(){

    const box =
        document.getElementById(
            "transactionsTable"
        );


    const typeFilter =
        document.getElementById(
            "filterType"
        ).value;


    const fromFilter =
        document.getElementById(
            "filterFrom"
        ).value;


    const toFilter =
        document.getElementById(
            "filterTo"
        ).value;


    let list =
        [...allTransactions];


    if(typeFilter){

        list =
            list.filter(t =>
                getField(
                    t,
                    ["نوع المعاملة","النوع"]
                )
                === typeFilter
            );

    }


    if(fromFilter){

        list =
            list.filter(t => {

                const d =
                    getField(t,["التاريخ","تاريخ"]);


                const date =
                    new Date(d);


                return (
                    !isNaN(date.getTime()) &&
                    date >= new Date(fromFilter)
                );

            });

    }


    if(toFilter){

        list =
            list.filter(t => {

                const d =
                    getField(t,["التاريخ","تاريخ"]);


                const date =
                    new Date(d);


                return (
                    !isNaN(date.getTime()) &&
                    date <= new Date(toFilter)
                );

            });

    }


    if(!list.length){

        box.innerHTML = `
            <div class="empty">
                لا توجد معاملات مطابقة
            </div>
        `;

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>التاريخ</th>

                    <th>الموظف</th>

                    <th>نوع المعاملة</th>

                    <th>التفاصيل</th>

                </tr>

            </thead>

            <tbody>

    `;


    list
    .slice()
    .reverse()
    .forEach(t => {

        html += `

            <tr>

                <td>
                    ${formatDate(getField(t,["التاريخ","تاريخ"]))}
                </td>

                <td>
                    ${safe(getField(t,["اسم الموظف","الاسم"]))}
                </td>

                <td>
                    ${transactionBadge(
                        getField(t,["نوع المعاملة","النوع"])
                    )}
                </td>

                <td>
                    ${safe(
                        getField(t,["الملاحظات","ملاحظات"])
                    ) || "-"}
                </td>

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

    `;


    box.innerHTML =
        html;

}


document
.getElementById("filterType")
.addEventListener(
    "change",
    renderTransactionsTable
);


document
.getElementById("filterFrom")
.addEventListener(
    "change",
    renderTransactionsTable
);


document
.getElementById("filterTo")
.addEventListener(
    "change",
    renderTransactionsTable
);


/* =========================================
   BADGE
========================================= */

function transactionBadge(type){

    let cls =
        "badge";


    if(type === "مباشرة"){
        cls += " badge-direct";
    }
    else if(type === "إجازة"){
        cls += " badge-leave";
    }
    else if(type === "إنذار"){
        cls += " badge-warning";
    }
    else if(type === "إنهاء خدمة"){
        cls += " badge-end";
    }


    return `
        <span class="${cls}">
            ${safe(type)}
        </span>
    `;

}


/* =========================================
   التاريخ
========================================= */

function formatDate(value){

    if(!value)
        return "-";


    const date =
        new Date(value);


    if(isNaN(date.getTime())){

        return safe(value);

    }


    return date.toLocaleDateString(
        "en-GB"
    );

}


/* =========================================
   حماية النص
========================================= */

function safe(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   START
========================================= */

loadData();

</script>

</body>
</html>
