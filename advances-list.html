<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سجل السلف - Shassiha HR</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Cairo',sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

.header{
    background:#2878d0;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.header h1{
    font-size:22px;
}

.header a{
    color:white;
    text-decoration:none;
    font-size:14px;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.toolbar{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
}

.toolbar input,
.toolbar select{
    padding:10px 14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-family:Cairo;
    font-size:13px;
    background:white;
}

.toolbar input{
    flex:1;
    min-width:180px;
}

.add-btn{
    background:#2878d0;
    color:white;
    text-decoration:none;
    border-radius:10px;
    padding:10px 18px;
    font-size:13px;
    font-weight:bold;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:white;
    border-radius:14px;
    padding:16px;
    text-align:center;
    border:1px solid #eee;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.stat small{
    display:block;
    color:#777;
    margin-bottom:5px;
}

.stat strong{
    font-size:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}

th,
td{
    padding:11px 10px;
    border-bottom:1px solid #eee;
    text-align:center;
    font-size:13px;
    white-space:nowrap;
}

th{
    background:#eaf2fc;
    color:#1c5aa0;
}

.badge{
    display:inline-block;
    padding:4px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.badge-active{ background:#e7f7ed; color:#16833b; }
.badge-cancelled{ background:#ffe5e5; color:#c62828; }

.money{
    font-weight:600;
}

.empty,
.loading{
    text-align:center;
    padding:35px;
    color:#888;
}

@media(max-width:700px){

    .header{
        flex-direction:column;
        gap:8px;
        text-align:center;
    }

    .toolbar{
        flex-direction:column;
        align-items:stretch;
    }

    .stats{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>


<div class="header">

    <h1>
        📑 سجل السلف
    </h1>

    <a href="index.html">
        ← الرئيسية
    </a>

</div>


<div class="container">


    <div class="toolbar">

        <input
            type="text"
            id="search"
            placeholder="ابحث بالاسم أو الرقم الوظيفي..."
            oninput="renderTable()">

        <input
            type="month"
            id="monthFilter"
            onchange="renderTable()">

        <select id="statusFilter" onchange="renderTable()">
            <option value="">كل الحالات</option>
            <option value="مسجلة">مسجلة فقط</option>
            <option value="ملغاة">ملغاة فقط</option>
        </select>

        <a class="add-btn" href="advances.html">
            💰 سلفة جديدة
        </a>

    </div>


    <div class="stats">

        <div class="stat">
            <small>عدد السلف الظاهرة</small>
            <strong id="statCount">0</strong>
        </div>

        <div class="stat">
            <small>مجموع المبالغ</small>
            <strong id="statTotal">0</strong>
        </div>

        <div class="stat">
            <small>عدد الملغاة</small>
            <strong id="statCancelled">0</strong>
        </div>

    </div>


    <div class="card">

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>رقم السلفة</th>
                        <th>الرقم الوظيفي</th>
                        <th>اسم الموظف</th>
                        <th>الشهر</th>
                        <th>الراتب</th>
                        <th>المستحق قبل السلفة</th>
                        <th>الحد 35%</th>
                        <th>مبلغ السلفة</th>
                        <th>المتبقي</th>
                        <th>التاريخ</th>
                        <th>الحالة</th>
                        <th>الملاحظات</th>
                    </tr>
                </thead>

                <tbody id="advancesBody">
                    <tr>
                        <td colspan="12" class="loading">⏳ جاري التحميل...</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =========================================
   API
========================================= */

const API =
"https://script.google.com/macros/s/AKfycbw6pnqbRn3VyJvFjk0RGfEt8VXdBkOq2uqooSvxi0onjcUStpJ_hOGNZVPLimRA-ZNAGQ/exec";


let allAdvances = [];


/* =========================================
   تحميل كل السلف
========================================= */

async function loadAdvances(){

    const body =
        document.getElementById("advancesBody");

    try{

        const response =
            await fetch(API,{
                method:"POST",
                body:JSON.stringify({action:"getAdvances"})
            });

        const data =
            await response.json();

        if(data.status !== "success"){
            throw new Error(data.message || "فشل تحميل السلف");
        }

        allAdvances = data.advances || [];

        renderTable();

    }
    catch(error){

        body.innerHTML = `
            <tr><td colspan="12" class="empty">❌ ${safe(error.message)}</td></tr>
        `;

    }

}


/* =========================================
   عرض الجدول (مع فلترة وبحث)
========================================= */

function renderTable(){

    const body =
        document.getElementById("advancesBody");

    const search =
        document.getElementById("search").value.trim().toLowerCase();

    const monthFilter =
        document.getElementById("monthFilter").value;

    const statusFilter =
        document.getElementById("statusFilter").value;


    let list = allAdvances.filter(item => {

        const status =
            String(item["الحالة"] || "مسجلة").trim();

        if(statusFilter && status !== statusFilter){
            return false;
        }

        if(monthFilter && String(item["الشهر"] || "").trim() !== monthFilter){
            return false;
        }

        if(search){

            const text = (
                String(item["الموظف"] || "") + " " +
                String(item["Employee ID"] || "")
            ).toLowerCase();

            if(!text.includes(search)){
                return false;
            }

        }

        return true;

    });


    // إحصائيات

    let total = 0, cancelled = 0;

    list.forEach(item => {

        const status =
            String(item["الحالة"] || "مسجلة").trim();

        if(status === "ملغاة"){
            cancelled++;
        }
        else{
            total += Number(item["مبلغ السلفة"] || 0);
        }

    });

    document.getElementById("statCount").innerText = list.length;
    document.getElementById("statTotal").innerText = money(total);
    document.getElementById("statCancelled").innerText = cancelled;


    if(!list.length){

        body.innerHTML = `
            <tr><td colspan="12" class="empty">لا توجد سلف مطابقة</td></tr>
        `;

        return;

    }


    body.innerHTML =
        list.slice().reverse().map(item => {

            const status =
                String(item["الحالة"] || "مسجلة").trim();

            const isCancelled =
                status === "ملغاة";

            return `
                <tr>
                    <td><strong>${safe(item["Advance ID"])}</strong></td>
                    <td>${safe(item["Employee ID"])}</td>
                    <td>${safe(item["الموظف"])}</td>
                    <td>${safe(item["الشهر"])}</td>
                    <td class="money">${money(item["الراتب"])}</td>
                    <td class="money">${money(item["المستحق قبل السلفة"])}</td>
                    <td class="money">${money(item["الحد الأعلى 35%"])}</td>
                    <td class="money">${money(item["مبلغ السلفة"])}</td>
                    <td class="money">${money(item["المتبقي بعد السلفة"])}</td>
                    <td>${formatDate(item["التاريخ"])}</td>
                    <td>
                        <span class="badge ${isCancelled ? "badge-cancelled" : "badge-active"}">
                            ${safe(status)}
                        </span>
                    </td>
                    <td>${safe(item["ملاحظات"]) || "-"}</td>
                </tr>
            `;

        }).join("");

}


/* =========================================
   تنسيق المال
========================================= */

function money(value){

    const number =
        Number(value || 0);

    return number.toLocaleString("en-US");

}


/* =========================================
   التاريخ
========================================= */

function formatDate(value){

    if(!value) return "-";

    const date = new Date(value);

    if(isNaN(date.getTime())){
        return safe(value);
    }

    return date.toLocaleDateString("en-GB");

}


/* =========================================
   حماية النص
========================================= */

function safe(value){

    if(value === null || value === undefined) return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   تشغيل
========================================= */

loadAdvances();

</script>

</body>
</html>
