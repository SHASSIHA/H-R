<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الحضور والغياب - Shassiha HR</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Cairo',sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

.header{
    background:#2878d0;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.header h1{
    font-size:22px;
}

.header a{
    color:white;
    text-decoration:none;
    font-size:14px;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.message{
    display:none;
    padding:13px;
    border-radius:10px;
    margin-bottom:20px;
    text-align:center;
    font-weight:bold;
}

.success{
    display:block;
    background:#e7f7ed;
    color:#16833b;
}

.error{
    display:block;
    background:#ffe5e5;
    color:#c62828;
}

.card{
    background:white;
    border-radius:16px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
    padding-bottom:10px;
    border-bottom:1px solid #eee;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    align-items:end;
}

.field{
    display:flex;
    flex-direction:column;
}

label{
    font-size:13px;
    color:#555;
    margin-bottom:6px;
    font-weight:bold;
}

input,
select{
    padding:11px;
    border:1px solid #ddd;
    border-radius:10px;
    font-family:Cairo;
    font-size:13px;
    outline:none;
    background:white;
}

input:focus,
select:focus{
    border-color:#2878d0;
}

.btn{
    border:0;
    border-radius:10px;
    padding:11px 20px;
    cursor:pointer;
    font-family:Cairo;
    font-size:13px;
    font-weight:bold;
}

.save{
    background:#2878d0;
    color:white;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:white;
    border-radius:14px;
    padding:16px;
    text-align:center;
    border:1px solid #eee;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.stat small{
    display:block;
    color:#777;
    margin-bottom:5px;
}

.stat strong{
    font-size:22px;
}

.present{ color:#16833b; }
.absent{ color:#c62828; }
.late{ color:#a56a00; }
.leave{ color:#2878d0; }

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px;
}

th,
td{
    padding:11px 10px;
    border-bottom:1px solid #eee;
    text-align:center;
    font-size:13px;
    white-space:nowrap;
}

th{
    background:#eaf2fc;
    color:#1c5aa0;
}

.badge{
    display:inline-block;
    padding:4px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.badge-present{ background:#e7f7ed; color:#16833b; }
.badge-absent{ background:#ffe5e5; color:#c62828; }
.badge-late{ background:#fff4dc; color:#a56a00; }
.badge-leave{ background:#e8f1ff; color:#2878d0; }

.empty,
.loading{
    text-align:center;
    padding:30px;
    color:#888;
}

@media(max-width:800px){

    .grid{
        grid-template-columns:1fr 1fr;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .header{
        flex-direction:column;
        gap:8px;
        text-align:center;
    }

}

@media(max-width:500px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>


<div class="header">

    <h1>
        🕐 الحضور والغياب
    </h1>

    <a href="index.html">
        ← الرئيسية
    </a>

</div>


<div class="container">


    <div id="message" class="message"></div>


    <!-- ============================= -->
    <!-- تسجيل حضور جديد -->
    <!-- ============================= -->

    <div class="card">

        <div class="title">
            ➕ تسجيل حضور موظف
        </div>

        <div class="grid">

            <div class="field">
                <label>الموظف *</label>
                <select id="employee">
                    <option value="">⏳ جاري تحميل الموظفين...</option>
                </select>
            </div>

            <div class="field">
                <label>التاريخ *</label>
                <input type="date" id="date">
            </div>

            <div class="field">
                <label>الحالة *</label>
                <select id="status">
                    <option value="حاضر">حاضر</option>
                    <option value="غائب">غائب</option>
                    <option value="متأخر">متأخر</option>
                    <option value="إجازة">إجازة</option>
                </select>
            </div>

            <div class="field">
                <label>وقت الحضور</label>
                <input type="time" id="checkIn">
            </div>

            <div class="field">
                <label>وقت الانصراف</label>
                <input type="time" id="checkOut">
            </div>

            <div class="field" style="grid-column:span 2;">
                <label>ملاحظات</label>
                <input type="text" id="notes" placeholder="ملاحظات إن وجدت">
            </div>

            <div class="field">
                <button class="btn save" id="saveBtn" onclick="saveAttendance()">
                    💾 حفظ
                </button>
            </div>

        </div>

    </div>


    <!-- ============================= -->
    <!-- إحصائيات اليوم -->
    <!-- ============================= -->

    <div class="stats">

        <div class="stat">
            <small>حاضرون</small>
            <strong class="present" id="statPresent">0</strong>
        </div>

        <div class="stat">
            <small>غائبون</small>
            <strong class="absent" id="statAbsent">0</strong>
        </div>

        <div class="stat">
            <small>متأخرون</small>
            <strong class="late" id="statLate">0</strong>
        </div>

        <div class="stat">
            <small>إجازة</small>
            <strong class="leave" id="statLeave">0</strong>
        </div>

    </div>


    <!-- ============================= -->
    <!-- سجل الحضور -->
    <!-- ============================= -->

    <div class="card">

        <div class="title">
            📋 سجل الحضور
            <span style="font-weight:normal; font-size:13px; color:#777;">
                (يعرض سجل التاريخ المختار فوق)
            </span>
        </div>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>التاريخ</th>
                        <th>اسم الموظف</th>
                        <th>القسم</th>
                        <th>وقت الحضور</th>
                        <th>وقت الانصراف</th>
                        <th>الحالة</th>
                        <th>ملاحظات</th>
                    </tr>
                </thead>

                <tbody id="attendanceBody">
                    <tr>
                        <td colspan="7" class="loading">⏳ جاري التحميل...</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =========================================
   API
========================================= */

const API =
"https://script.google.com/macros/s/AKfycbw6pnqbRn3VyJvFjk0RGfEt8VXdBkOq2uqooSvxi0onjcUStpJ_hOGNZVPLimRA-ZNAGQ/exec";


let employees = [];


/* =========================================
   تحميل الموظفين
========================================= */

async function loadEmployees(){

    const select =
        document.getElementById("employee");

    try{

        const response =
            await fetch(API,{
                method:"POST",
                body:JSON.stringify({action:"getEmployees"})
            });

        const data =
            await response.json();

        if(data.status !== "success"){
            throw new Error(data.message || "فشل تحميل الموظفين");
        }

        employees = data.employees || [];

        select.innerHTML = `<option value="">اختر الموظف</option>`;

        employees.forEach(employee => {

            if(String(employee["الحالة"] || "").trim() === "منتهي الخدمة"){
                return;
            }

            const option = document.createElement("option");

            option.value = employee["Employee ID"];
            option.dataset.name = employee["الاسم"] || "";
            option.dataset.department = employee["القسم"] || "";

            option.textContent =
                (employee["الاسم"] || "بدون اسم") + " — " + (employee["Employee ID"] || "");

            select.appendChild(option);

        });

    }
    catch(error){

        select.innerHTML = `<option value="">❌ فشل التحميل</option>`;

        showMessage("❌ " + error.message, "error");

    }

}


/* =========================================
   حفظ سجل حضور
========================================= */

async function saveAttendance(){

    const select =
        document.getElementById("employee");

    const employeeId =
        select.value;

    if(!employeeId){
        showMessage("❌ يرجى اختيار الموظف", "error");
        return;
    }

    const selectedOption =
        select.options[select.selectedIndex];

    const employeeName =
        selectedOption.dataset.name;

    const department =
        selectedOption.dataset.department;

    const date =
        document.getElementById("date").value;

    if(!date){
        showMessage("❌ يرجى اختيار التاريخ", "error");
        return;
    }

    const status =
        document.getElementById("status").value;

    const checkIn =
        document.getElementById("checkIn").value;

    const checkOut =
        document.getElementById("checkOut").value;

    const notes =
        document.getElementById("notes").value.trim();


    const btn =
        document.getElementById("saveBtn");

    btn.disabled = true;
    btn.innerText = "⏳ جاري الحفظ...";


    try{

        const response =
            await fetch(API,{
                method:"POST",
                body:JSON.stringify({
                    action:"addAttendance",
                    date: date,
                    employeeId: employeeId,
                    employeeName: employeeName,
                    department: department,
                    checkIn: checkIn,
                    checkOut: checkOut,
                    status: status,
                    notes: notes
                })
            });

        const data =
            await response.json();

        if(data.status !== "success"){
            throw new Error(data.message || "فشل تسجيل الحضور");
        }

        showMessage("✅ تم تسجيل الحضور بنجاح", "success");

        document.getElementById("checkIn").value = "";
        document.getElementById("checkOut").value = "";
        document.getElementById("notes").value = "";

        loadAttendance();

    }
    catch(error){

        showMessage("❌ " + error.message, "error");

    }
    finally{

        btn.disabled = false;
        btn.innerText = "💾 حفظ";

    }

}


/* =========================================
   تحميل سجل الحضور (حسب التاريخ المختار)
========================================= */

async function loadAttendance(){

    const body =
        document.getElementById("attendanceBody");

    const date =
        document.getElementById("date").value;

    body.innerHTML = `
        <tr><td colspan="7" class="loading">⏳ جاري التحميل...</td></tr>
    `;

    try{

        const response =
            await fetch(API,{
                method:"POST",
                body:JSON.stringify({
                    action:"getAttendance",
                    date: date || undefined
                })
            });

        const data =
            await response.json();

        if(data.status !== "success"){
            throw new Error(data.message || "فشل تحميل السجل");
        }

        const list =
            data.attendance || [];

        renderStats(list);

        if(!list.length){
            body.innerHTML = `
                <tr><td colspan="7" class="empty">لا يوجد سجل لهذا التاريخ</td></tr>
            `;
            return;
        }

        body.innerHTML =
            list.slice().reverse().map(item => `
                <tr>
                    <td>${formatDate(item["التاريخ"])}</td>
                    <td>${safe(item["اسم الموظف"])}</td>
                    <td>${safe(item["القسم"])}</td>
                    <td>${safe(item["وقت الحضور"]) || "-"}</td>
                    <td>${safe(item["وقت الانصراف"]) || "-"}</td>
                    <td>${statusBadge(item["الحالة"])}</td>
                    <td>${safe(item["ملاحظات"]) || "-"}</td>
                </tr>
            `).join("");

    }
    catch(error){

        body.innerHTML = `
            <tr><td colspan="7" class="empty">❌ ${safe(error.message)}</td></tr>
        `;

    }

}


document
.getElementById("date")
.addEventListener("change", loadAttendance);


/* =========================================
   إحصائيات
========================================= */

function renderStats(list){

    let present = 0, absent = 0, late = 0, leave = 0;

    list.forEach(item => {

        const status =
            String(item["الحالة"] || "").trim();

        if(status === "حاضر") present++;
        else if(status === "غائب") absent++;
        else if(status === "متأخر") late++;
        else if(status === "إجازة") leave++;

    });

    document.getElementById("statPresent").innerText = present;
    document.getElementById("statAbsent").innerText = absent;
    document.getElementById("statLate").innerText = late;
    document.getElementById("statLeave").innerText = leave;

}


/* =========================================
   شارة الحالة
========================================= */

function statusBadge(status){

    let cls = "badge";

    if(status === "حاضر") cls += " badge-present";
    else if(status === "غائب") cls += " badge-absent";
    else if(status === "متأخر") cls += " badge-late";
    else if(status === "إجازة") cls += " badge-leave";

    return `<span class="${cls}">${safe(status)}</span>`;

}


/* =========================================
   التاريخ
========================================= */

function formatDate(value){

    if(!value) return "-";

    const date = new Date(value);

    if(isNaN(date.getTime())){
        return safe(value);
    }

    return date.toLocaleDateString("en-GB");

}


/* =========================================
   حماية النص
========================================= */

function safe(value){

    if(value === null || value === undefined) return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   الرسائل
========================================= */

function showMessage(text, type){

    const box =
        document.getElementById("message");

    box.innerText = text;
    box.className = "message " + type;

    window.scrollTo({top:0, behavior:"smooth"});

}


/* =========================================
   تشغيل الصفحة
========================================= */

document.getElementById("date").value =
    new Date().toISOString().split("T")[0];

loadEmployees();
loadAttendance();

</script>

</body>
</html>
