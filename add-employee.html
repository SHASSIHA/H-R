<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إضافة موظف - Shassiha HR</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Cairo',sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

.header{
    background:#ff7a00;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.header h1{
    font-size:22px;
}

.header a{
    color:white;
    text-decoration:none;
    font-size:14px;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}

.message{
    display:none;
    padding:13px;
    border-radius:10px;
    margin-bottom:20px;
    text-align:center;
    font-weight:bold;
}

.success{
    display:block;
    background:#e7f7ed;
    color:#16833b;
}

.error{
    display:block;
    background:#ffe5e5;
    color:#c62828;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
    padding-bottom:12px;
    border-bottom:1px solid #eee;
}

.section-label{
    font-size:14px;
    font-weight:bold;
    color:#ff7a00;
    margin:22px 0 12px;
}

.section-label:first-of-type{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-size:13px;
    color:#555;
    margin-bottom:7px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:14px;
    background:white;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#ff7a00;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:25px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 22px;
    cursor:pointer;
    font-family:Cairo;
    font-size:14px;
}

.save{
    background:#ff7a00;
    color:white;
}

.back{
    background:#333;
    color:white;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .header{
        flex-direction:column;
        gap:8px;
        text-align:center;
    }

    .buttons button{
        width:100%;
    }

}

</style>

</head>

<body>


<div class="header">

    <h1>
        ➕ إضافة موظف
    </h1>

    <a href="index.html">
        ← الرئيسية
    </a>

</div>


<div class="container">


    <div id="message" class="message"></div>


    <div class="card">

        <div class="title">
            ➕ بيانات الموظف الجديد
        </div>


        <div class="section-label">
            📋 البيانات الأساسية
        </div>

        <div class="grid">

            <div class="full">
                <label>الاسم الكامل *</label>
                <input type="text" id="name" placeholder="مثلاً: أحمد محمد">
            </div>

            <div>
                <label>رقم الهاتف *</label>
                <input type="text" id="phone" placeholder="07xxxxxxxxx">
            </div>

            <div>
                <label>القسم *</label>
                <input type="text" id="department" placeholder="مثلاً: المطبخ">
            </div>

            <div>
                <label>الوظيفة *</label>
                <input type="text" id="position" placeholder="مثلاً: خباز">
            </div>

            <div>
                <label>الراتب *</label>
                <input type="number" id="salary" min="0" step="1000" placeholder="مثلاً: 900000">
            </div>

            <div>
                <label>تاريخ المباشرة *</label>
                <input type="date" id="hireDate">
            </div>

            <div class="full">
                <label>العنوان</label>
                <input type="text" id="address" placeholder="عنوان السكن">
            </div>

        </div>


        <div class="section-label">
            🚨 بيانات إضافية (اختياري)
        </div>

        <div class="grid">

            <div>
                <label>جهة اتصال للطوارئ</label>
                <input type="text" id="emergencyContact" placeholder="اسم الشخص">
            </div>

            <div>
                <label>رقم هاتف الطوارئ</label>
                <input type="text" id="emergencyPhone" placeholder="07xxxxxxxxx">
            </div>

            <div>
                <label>رقم البطاقة الوطنية</label>
                <input type="text" id="nationalId">
            </div>

            <div>
                <label>تاريخ انتهاء العقد</label>
                <input type="date" id="contractEnd">
            </div>

            <div class="full">
                <label>ملاحظات</label>
                <textarea id="notes" placeholder="ملاحظات إضافية إن وجدت"></textarea>
            </div>

        </div>


        <div class="buttons">

            <button
                id="saveBtn"
                class="save"
                onclick="saveEmployee()">

                ➕ حفظ الموظف

            </button>

            <button
                class="back"
                onclick="location.href='employees.html'">

                ← رجوع لقائمة الموظفين

            </button>

        </div>

    </div>

</div>


<script>

/* =========================================
   API
========================================= */

const API =
"https://script.google.com/macros/s/AKfycbw6pnqbRn3VyJvFjk0RGfEt8VXdBkOq2uqooSvxi0onjcUStpJ_hOGNZVPLimRA-ZNAGQ/exec";


/* =========================================
   حفظ الموظف
========================================= */

async function saveEmployee(){

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const department =
        document.getElementById("department").value.trim();

    const position =
        document.getElementById("position").value.trim();

    const salary =
        document.getElementById("salary").value;

    const hireDate =
        document.getElementById("hireDate").value;

    const address =
        document.getElementById("address").value.trim();

    const emergencyContact =
        document.getElementById("emergencyContact").value.trim();

    const emergencyPhone =
        document.getElementById("emergencyPhone").value.trim();

    const nationalId =
        document.getElementById("nationalId").value.trim();

    const contractEnd =
        document.getElementById("contractEnd").value;

    const notes =
        document.getElementById("notes").value.trim();


    if(!name || !phone || !department || !position || !salary || !hireDate){

        showMessage(
            "❌ يرجى تعبئة كل الحقول المطلوبة (*)",
            "error"
        );

        return;

    }


    const confirmed =
        confirm(
            "هل تريد إضافة الموظف؟\n\n" +
            name + "\n" +
            department + " — " + position
        );

    if(!confirmed) return;


    const btn =
        document.getElementById("saveBtn");

    btn.disabled = true;
    btn.innerText = "⏳ جاري الحفظ...";


    try{

        const response =
            await fetch(API,{

                method:"POST",

                body:JSON.stringify({

                    action:"addEmployee",

                    name: name,
                    phone: phone,
                    address: address,
                    department: department,
                    position: position,
                    hireDate: hireDate,
                    salary: salary,
                    emergencyContact: emergencyContact,
                    emergencyPhone: emergencyPhone,
                    nationalId: nationalId,
                    contractEnd: contractEnd,
                    notes: notes

                })

            });


        const data =
            await response.json();


        if(data.status !== "success"){

            throw new Error(
                data.message || "فشل حفظ الموظف"
            );

        }


        showMessage(
            "✅ تمت إضافة الموظف بنجاح — الرقم الوظيفي: " +
            data.employeeId,
            "success"
        );


        document.querySelectorAll(
            "input, textarea"
        ).forEach(field => field.value = "");


        btn.innerText = "➕ حفظ الموظف";

        btn.disabled = false;


    }
    catch(error){

        console.error(error);

        showMessage(
            "❌ " + error.message,
            "error"
        );

        btn.disabled = false;
        btn.innerText = "➕ حفظ الموظف";

    }

}


/* =========================================
   الرسائل
========================================= */

function showMessage(text, type){

    const box =
        document.getElementById("message");

    box.innerText = text;

    box.className =
        "message " + type;

    window.scrollTo({top:0, behavior:"smooth"});

}


/* =========================================
   تشغيل الصفحة
========================================= */

document.getElementById("hireDate").value =
    new Date().toISOString().split("T")[0];

</script>

</body>
</html>
